name: GitHub One-Click Build Mobile App (Android APK & iOS TrollStore IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (ImageMagick & Pillow)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y imagemagick python3-pip python3-pillow || true

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Web Dist & Deployment ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-Web-And-Baota-Package
          path: |
            baota_deploy.zip
            daijia_deploy.zip
            welcome_bg.jpg
            hwdjtb.png

  build-ios-trollstore:
    name: Build iOS TrollStore IPA (Unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build Unsigned iOS Archive for TrollStore
        run: |
          if [ -d "ios/App" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO
            
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -qr Heiwan-Daijia-TrollStore.ipa Payload
          fi

      - name: Upload iOS TrollStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heiwan-Daijia-iOS-TrollStore-IPA
          path: Heiwan-Daijia-TrollStore.ipa
          if-no-files-found: ignore

